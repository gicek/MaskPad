name: MaskPad
# Source language is English: user-facing text is written as English literals in code; translations live in the String Catalog.
options:
  developmentLanguage: en
  defaultConfig: Debug
  bundleIdPrefix: com.gicek
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    # Pin the helper and its Swift wrapper together; there are no versioned releases.
    revision: 7d5b6cc99b933ae2a2378d11ee9798acf6b69009
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1  # pinned so releases are reproducible (Package.resolved is not committed)

fileGroups:
  - Config/MaskPad.xcconfig
  - Config/MaskPad.local.xcconfig.example
  - README.md

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  MaskPad:
    type: application
    platform: macOS
    productName: MaskPad
    configFiles:
      Debug: Config/MaskPad.xcconfig
      Release: Config/MaskPad.xcconfig
    sources:
      - path: MaskPad
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
        codeSign: true
      - package: Sparkle
    info:
      path: MaskPad/Info.plist
      properties:
        CFBundleDisplayName: MaskPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # Menu-bar-only app: no Dock icon and not listed in ⌘Tab.
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 gicek"
        # Sparkle in-app updates. The feed is the appcast.xml attached to the latest GitHub release; every
        # update is verified against this EdDSA public key (the private key lives in the release Mac's Keychain).
        SUFeedURL: https://github.com/gicek/MaskPad/releases/latest/download/appcast.xml
        SUPublicEDKey: M+ujV4U9U66+vZ7WznIXqax87bNNthJcK9iiknp4UTs=
        SUEnableAutomaticChecks: true
        SUVerifyUpdateBeforeExtraction: true
        # maskpad://on and maskpad://status, for launchers, Shortcuts, scripts and the maskpad tool (MaskCommand).
        CFBundleURLTypes:
          - CFBundleURLName: com.gicek.maskpad
            CFBundleURLSchemes: [maskpad]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gicek.maskpad
        PRODUCT_NAME: MaskPad
        PRODUCT_MODULE_NAME: MaskPad
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox: HID-level event taps, private SkyLight/DisplayServices, and changing the system
        # Screen Sharing settings all require it off, so distribution is Developer ID only, not the App Store.
        ENABLE_APP_SANDBOX: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Icons are generated from design/logo by make icons (Scripts/build_icons.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Release builds must not carry the get-task-allow debugging entitlement (notarization rejects it).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  MaskPadTests:
    type: bundle.unit-test
    platform: macOS
    # Same signing as the app: the app uses the Hardened Runtime and only loads test bundles signed by the same team.
    configFiles:
      Debug: Config/MaskPad.xcconfig
      Release: Config/MaskPad.xcconfig
    sources:
      - path: Tests
    dependencies:
      - target: MaskPad
      - package: MediaRemoteAdapter
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gicek.maskpad.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MaskPad.app/Contents/MacOS/MaskPad
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  MaskPad:
    build:
      targets:
        MaskPad: all
        MaskPadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaskPadTests
    archive:
      config: Release
